# yaml-language-server: $schema=../../schemas/dashboard-dsl-v1.3.schema.json
schema_version: "1"
target_schemas: [grafana-v2-13]
id: mock-service
title: Mock Service
time_range: 6h
refresh_interval: 1m
timezone: utc
source:
  kind: metrics
variables:
  env:
    choices: field_values(env)
    default: dev
  job:
    multiple: true
    choices: field_values(job, "__name__:mock_requests_total and env:${env}")
rows:
  - title: Traffic
    panels:
      - title: Requests by job
        kind: time_series
        height: 300
        unit: per_second
        queries:
          - query: __name__:mock_requests_total and env:${env} and job:${job} | rate(5m) | sum() by job
            legend_format: "{{job}}"
      - title: Requests and errors
        description: Two queries, each drawn as its own series and named by its legend.
        kind: time_series
        height: 300
        unit: per_second
        queries:
          - query: __name__:mock_requests_total and env:${env} and job:${job} | rate(5m) | sum()
            legend_format: requests
          - query: __name__:mock_errors_total and env:${env} and job:${job} | rate(5m) | sum()
            legend_format: errors

  - title: Health
    panels:
      - title: Up by job
        description: Each value mapped to its text and color; the legend names the two states.
        kind: status_history
        height: 200
        unit: count
        value_mappings:
          "0": { text: down, color: red }
          "1": { text: up, color: green }
        queries:
          - query: __name__:up and env:${env} and job:${job} | min() by job
            legend_format: "{{job}}"
            min_interval: 1m
      - title: Jobs up
        description: The deprecated form, a value mapped to its text alone, colored by the thresholds.
        kind: stat
        width: 25
        height: 200
        unit: count
        calculation: last
        value_mappings:
          "0": none  # the deprecated form, kept as its example
        thresholds:
          - value: 0
            color: red
          - value: 1
            color: green
        queries:
          - query: __name__:up and env:${env} and job:${job} | sum()
      - title: Errors
        description: The first threshold leaves out its value, so its color holds from the lowest.
        kind: stat
        width: 25
        height: 200
        unit: per_second
        calculation: last
        thresholds:
          - color: green
          - value: 1
            color: red
        queries:
          - query: __name__:mock_errors_total and env:${env} and job:${job} | rate(5m) | sum()

  - title: Builds
    panels:
      - title: Builds by job
        description: Two queries side by side, one row per job, the second written as a date.
        kind: table
        height: 200
        unit: count
        decimals: 0
        queries:
          - query: __name__:mock_builds_total and env:${env} and job:${job} | max() by job
            value_column_header: builds
          - query: __name__:mock_last_build_timestamp_seconds and env:${env} and job:${job} | max() by job
            value_column_header: last_build
            value_format: "%{%Y-%02m-%02d %02H:%02M:%02S}C"
