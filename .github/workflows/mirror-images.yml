name: Mirror images

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  mirror:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Log in to the GitHub Container Registry
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Mirror each carried Grafana release
        env:
          REGISTRY: ghcr.io/${{ github.repository_owner }}/
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          for image in $(go run ./internal/grafanaimages); do
            if docker buildx imagetools inspect "${REGISTRY}${image}" >/dev/null 2>&1; then
              echo "${REGISTRY}${image} is mirrored already"
              continue
            fi
            docker buildx imagetools create \
              --annotation "index:org.opencontainers.image.source=${SOURCE}" \
              --tag "${REGISTRY}${image}" \
              "docker.io/${image}"
            echo "mirrored docker.io/${image} to ${REGISTRY}${image}"
          done
